<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>noteDRASI</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

<main class="app">


    <!-- =============================== -->
    <!-- ENCABEZADO -->
    <!-- =============================== -->

    <header class="header">

        <div>

            <div class="logo">
                note<span>DRASI</span>
            </div>

            <div class="subtitle">
                Personal notes
            </div>

        </div>

    </header>


    <!-- =============================== -->
    <!-- INICIO -->
    <!-- =============================== -->

    <section id="home-view">

        <h1 class="section-title">
            Mis carpetas
        </h1>

        <input
            class="search"
            type="search"
            placeholder="🔎 Buscar..."
        >

        <div class="brand-grid"></div>

    </section>


    <!-- =============================== -->
    <!-- CARPETA -->
    <!-- =============================== -->

    <section
        id="brand-view"
        style="display: none;"
    >

        <button
            id="back-button"
            class="back-button"
            type="button"
        >
            ← Volver
        </button>


        <div class="brand-header">

            <div
                id="brand-icon"
                class="brand-icon"
            >
                📁
            </div>

            <h2 id="brand-title">
                Carpeta
            </h2>

            <p id="brand-perfume-count">
                0 notas
            </p>

        </div>

<!-- CARPETAS DENTRO DE LA CARPETA -->

<div
    id="folder-grid"
    class="perfume-grid"
></div>

        <!-- NOTAS -->
        
        <div
            id="note-grid"
            class="perfume-grid"
        ></div>


        <button
            id="add-note-button"
            class="add-button"
            type="button"
            aria-label="Agregar nota"
        >
            +
        </button>

    </section>


    <!-- =============================== -->
    <!-- DETALLE DE NOTA -->
    <!-- =============================== -->

    <section
        id="note-view"
        style="display: none;"
    >

        <button
            id="note-back-button"
            class="back-button"
            type="button"
        >
            ← Volver
        </button>


        <article class="note-detail">

            <div
                id="note-detail-icon"
                class="brand-icon"
            >
                📝
            </div>


            <h2 id="note-detail-title">
                Nota
            </h2>


            <div
                id="note-detail-content"
                class="note-content"
            ></div>


            <div class="note-actions">

                <button
                    id="edit-note-button"
                    type="button"
                >
                    ✏️ Editar
                </button>


                <button
                    id="delete-note-button"
                    type="button"
                >
                    🗑️ Eliminar
                </button>

            </div>

        </article>

    </section>


    <!-- =============================== -->
    <!-- EDITOR DE NOTA -->
    <!-- =============================== -->

    <section
        id="note-editor-view"
        style="display: none;"
    >

        <button
            id="cancel-note-button"
            class="back-button"
            type="button"
        >
            ← Cancelar
        </button>


        <div class="note-editor">

            <h2 id="editor-title">
                Nueva nota
            </h2>


            <label for="note-title-input">
                Título
            </label>


            <input
                id="note-title-input"
                type="text"
                placeholder="Título de la nota"
                autocomplete="off"
            >


            <label for="note-content-input">
                Contenido
            </label>


            <textarea
                id="note-content-input"
                placeholder="Escribí tu nota..."
            ></textarea>


            <div class="editor-actions">

                <button
                    id="save-note-button"
                    type="button"
                >
                    💾 Guardar
                </button>


                <button
                    id="cancel-editor-button"
                    type="button"
                >
                    Cancelar
                </button>

            </div>

        </div>

    </section>


    <!-- =============================== -->
    <!-- AGREGAR CARPETA -->
    <!-- =============================== -->

    <button
        class="add-button"
        aria-label="Agregar carpeta"
        type="button"
    >
        +
    </button>


</main>


<script src="app.js"></script>

</body>

</html>
