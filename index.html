<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>noteDRASI</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

    <main class="app">


        <!-- ================================ -->
        <!-- ENCABEZADO -->
        <!-- ================================ -->

        <header class="header">

            <div>

                <div class="logo">
                    note<span>DRASI</span>
                </div>

                <div class="subtitle">
                    Personal fragrance archive
                </div>

            </div>

        </header>


        <!-- ================================ -->
        <!-- PANTALLA PRINCIPAL -->
        <!-- ================================ -->

        <section id="home-view">

            <h1 class="section-title">
                Perfumes Fichados
            </h1>


            <input
                class="search"
                type="search"
                placeholder="🔎 Buscar..."
            >


            <!-- Las marcas aparecen acá -->

            <div class="brand-grid"></div>


        </section>



        <!-- ================================ -->
        <!-- PANTALLA DE MARCA -->
        <!-- ================================ -->

        <section
            id="brand-view"
            class="brand-view hidden"
        >


            <button
                id="back-button"
                class="back-button"
                type="button"
            >
                ← Volver
            </button>


            <div class="brand-header">


                <div
                    id="brand-icon"
                    class="brand-icon"
                >
                    📁
                </div>


                <h2 id="brand-title">
                    Marca
                </h2>


                <p id="brand-perfume-count">
                    0 perfumes
                </p>


            </div>


            <div
                id="perfume-grid"
                class="perfume-grid"
            >


                <div class="empty-state">


                    <div class="empty-icon">
                        🧴
                    </div>


                    <div class="empty-title">
                        Todavía no hay perfumes
                    </div>


                    <div class="empty-text">
                        Próximamente podrás agregarlos acá.
                    </div>


                </div>


            </div>


        </section>



        <!-- ================================ -->
        <!-- BOTÓN AGREGAR MARCA -->
        <!-- ================================ -->

        <button
            class="add-button"
            aria-label="Agregar marca"
            type="button"
        >
            +
        </button>


    </main>


    <!-- ================================ -->
    <!-- JAVASCRIPT -->
    <!-- ================================ -->

    <script src="app.js"></script>


</body>

</html>
