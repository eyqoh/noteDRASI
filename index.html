<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>noteDRASI</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

    <main class="app">

        <header class="header">

            <div>

                <div class="logo">
                    note<span>DRASI</span>
                </div>

                <div class="subtitle">
                    Personal fragrance archive
                </div>

            </div>

        </header>


        <section>

            <h1 class="section-title">
                Perfumes Fichados
            </h1>


            <input
                class="search"
                type="search"
                placeholder="🔎 Buscar..."
            >


            <div class="brand-grid">

                <article class="brand-card">

                    <div class="brand-icon">
                        🟢
                    </div>

                    <div>

                        <div class="brand-name">
                            Natura
                        </div>

                        <div class="brand-count">
                            0 perfumes
                        </div>

                    </div>

                </article>


                <article class="brand-card">

                    <div class="brand-icon">
                        🟣
                    </div>

                    <div>

                        <div class="brand-name">
                            Maison Margiela
                        </div>

                        <div class="brand-count">
                            0 perfumes
                        </div>

                    </div>

                </article>


                <article class="brand-card">

                    <div class="brand-icon">
                        🟠
                    </div>

                    <div>

                        <div class="brand-name">
                            Solonoi
                        </div>

                        <div class="brand-count">
                            0 perfumes
                        </div>

                    </div>

                </article>

            </div>

        </section>


        <button
            class="add-button"
            aria-label="Agregar marca"
        >
            +
        </button>

    </main>

</body>
<script src="app.js"></script>
</html>
